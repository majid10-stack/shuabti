<style>
/* Layout: group picker (A/B/C) first, then a read-only phone-width app column with a bottom tab bar; content comes from the published data block. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#16231F; --muted:#5E6F69; --line:#D9E0DC;
  --brand:#0E5A4E; --brand-ink:#FFFFFF; --brand-soft:#DCEDE8;
  --amber:#B97A06; --amber-soft:#F8EBCB;
  --ok:#2E7D4F; --warn:#B3541E; --warn-soft:#F7E2D6;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1815; --surface:#18241F; --ink:#E6EEEA; --muted:#93A59E; --line:#2A3A34;
    --brand:#4FBFA8; --brand-ink:#08201A; --brand-soft:#1D3A33;
    --amber:#E5B042; --amber-soft:#3A2E12;
    --ok:#6FCB93; --warn:#F0935A; --warn-soft:#3C2418;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1815; --surface:#18241F; --ink:#E6EEEA; --muted:#93A59E; --line:#2A3A34;
  --brand:#4FBFA8; --brand-ink:#08201A; --brand-soft:#1D3A33;
  --amber:#E5B042; --amber-soft:#3A2E12;
  --ok:#6FCB93; --warn:#F0935A; --warn-soft:#3C2418;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;direction:rtl;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.mark{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:22px;flex:none}

/* group picker */
.gate{max-width:460px;margin-inline:auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:32px}
.gate .brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.gate .brand .mark{width:60px;height:60px;border-radius:18px;font-size:36px}
.gate h1{margin:0;font-family:var(--font-display);font-size:40px;line-height:1.1;font-weight:700}
.gate p{margin:0;color:var(--muted)}
.gate .ask{font-family:var(--font-display);font-size:22px;color:var(--ink);font-weight:700}
.gbtns{display:flex;flex-direction:column;gap:12px}
.gbtn{display:flex;align-items:center;gap:16px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.gbtn b{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--font-display);font-size:28px;font-weight:700;flex:none}
.gbtn strong{display:block;font-size:19px;font-weight:600;line-height:1.3}
.gbtn span{font-size:13px;color:var(--muted)}
.gbtn:hover,.gbtn:focus-visible{border-color:var(--brand)}
.owner{margin:0;font-weight:600;font-size:14px;color:var(--brand);background:var(--brand-soft);border-radius:10px;padding:6px 12px;align-self:flex-start}
.owner:empty{display:none}

/* app */
.app{max-width:460px;margin-inline:auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px}
header{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo h1{margin:0;font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1}
.logo small{display:block;color:var(--muted);font-size:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.gpill{font-family:var(--font-display);font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:999px;padding:1px 12px;font-size:15px;margin-inline-start:8px;vertical-align:middle}
.today{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.today .l{min-width:0}
.today .k{font-size:12px;opacity:.8}
.today .v{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.35}
.today .t{font-size:13px;opacity:.9}
.today .n{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1;text-align:center;flex:none}
.today .n span{display:block;font-family:var(--font-body);font-size:11px;font-weight:400;opacity:.85;margin-top:2px}
main{padding-top:18px;flex:1}
h2{font-family:var(--font-display);font-size:19px;margin:0 0 12px;font-weight:700}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.day{flex:1 0 auto;min-width:62px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px;text-align:center;font-size:13px;color:var(--muted)}
.day b{display:block;font-size:17px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.day[aria-pressed="true"] b{color:var(--brand)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.lec{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lec .time{width:62px;flex:none;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);line-height:1.4}
.lec .time b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.lec .body{min-width:0;border-inline-start:3px solid var(--brand);padding-inline-start:12px}
.lec .body strong{display:block;font-weight:600}
.lec .body span{color:var(--muted);font-size:13px}
.lec.now .body{border-color:var(--amber)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber);margin-inline-start:6px}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hw{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hw input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.hw .b{min-width:0;flex:1}
.hw strong{display:block;font-weight:600;overflow-wrap:anywhere}
.hw.done strong{text-decoration:line-through;color:var(--muted)}
.hw .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:2px}
.hw .note{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.due{font-weight:600;color:var(--warn)}
.hw.done .due{color:var(--ok)}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.folder{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.folder svg{width:30px;height:30px;stroke:var(--brand);fill:var(--brand-soft);stroke-width:1.6;stroke-linejoin:round;margin-bottom:6px}
.folder strong{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.folder span{font-size:12.5px;color:var(--muted)}
.folder:hover{border-color:var(--brand)}
.file{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.file:hover{border-color:var(--brand)}
.ext{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--brand-soft);color:var(--brand);letter-spacing:.03em;overflow:hidden}
.ext img{width:100%;height:100%;object-fit:cover}
.ext.doc{background:var(--warn-soft);color:var(--warn)}
.file .b{min-width:0;flex:1}
.file strong{display:block;font-weight:600;overflow-wrap:anywhere}
.file span{font-size:12.5px;color:var(--muted)}
.file .open{font-size:12.5px;color:var(--brand);font-weight:600;flex:none}
.ann{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ann.pin{border-color:var(--amber)}
.ann .h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.ann p{margin:0;overflow-wrap:anywhere}
.empty{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:14px;margin:0}
.foot{margin-top:16px;font-size:12.5px;color:var(--muted)}
nav{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav div{max-width:460px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:11.5px;color:var(--muted);position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--brand);font-weight:600}
nav button[aria-selected="true"]::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:3px;background:var(--brand)}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
</style>

      2:[['08:30','10:30','البصريات','قاعة 7 · د. خالد قاسم + د. هدى مسعود'],['10:30','12:30','اللغة الإنكليزية','قاعة 5 · م.م. أريج محمد'],['12:30','14:30','الفيزياء الذرية (مختبر)','مختبر 3 · أ.م.د. قصي خطاب عمر + د. أيمن عبد الجبار + ست سنا']],
      3:[['08:30','10:30','الإرشاد','قاعة 6'],['10:30','12:30','الفيزياء الحياتية','قاعة 7 · د. هدى مسعود + د. محمد عبد الله'],['12:30','14:30','البصريات (مختبر)','مختبر البصريات · قسم الفيزياء · د. طه مصطفى + د. إياد جياد']],
      4:[['08:30','10:30','الموجات الكهرومغناطيسية','قاعة 5 · د. خالد قاسم'],['10:30','12:30','جرائم حزب البعث في العراق','قاعة 7 · م.م. محمد محسن']]
    }
  };
  function subjectsOf(g){
    var all=[];Object.keys(SCHEDULES[g]).forEach(function(d){SCHEDULES[g][d].forEach(function(l){if(all.indexOf(l[2])<0)all.push(l[2])})});
    return all.filter(function(s){return s.indexOf('(مختبر)')<0}).concat(all.filter(function(s){return s.indexOf('(مختبر)')>-1}));
  }
  var now=new Date();var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var TODAY_IDX=today.getDay()<=4?today.getDay():-1;
  function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
  var weekStart=addDays(today,-today.getDay());
  function fmt(d){return FULLDAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]}
  var $=function(id){return document.getElementById(id)};
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}

  var G=null,SUBJECTS=[],st={day:0,filter:'all',folder:null,done:{}};
  try{st.done=JSON.parse(localStorage.getItem('shuabti-done')||'{}')||{}}catch(e){}
  function saveDone(){try{localStorage.setItem('shuabti-done',JSON.stringify(st.done))}catch(e){}}
  function gdata(){var g=(D.groups||{})[G]||{};return {homework:g.homework||[],announcements:g.announcements||[],files:g.files||{}}}
  function hwKey(h){return G+'|'+(h.t||'')+'|'+(h.s||'')+'|'+(h.date||'')}
  function daysLeft(date){var p=date.split('-');return Math.round((new Date(+p[0],+p[1]-1,+p[2])-today)/86400000)}

  function renderHeader(){
    var gd=gdata();
    $('gpill').textContent='شعبة '+G;
    $('sub').textContent='المرحلة الثانية · شعبة '+G;
    $('owner').textContent=D.owner?'الطالب: '+D.owner:'';
    var list=TODAY_IDX>=0?(SCHEDULES[G][TODAY_IDX]||[]):[];var next=list[0];
    var open=gd.homework.filter(function(h){return !st.done[hwKey(h)]}).length;
    $('today').innerHTML='<div class="l"><div class="k">اليوم · '+fmt(today)+'</div><div class="v">'+(next?esc(next[2]):'لا توجد محاضرات اليوم')+'</div><div class="t">'+(next?esc(next[0]+' · '+next[3]):'')+'</div></div><div class="n">'+open+'<span>واجب مفتوح</span></div>';
    $('hwBadge').textContent=open;$('hwBadge').hidden=!open;
    $('foot').textContent='للاطلاع فقط. الإضافة والتعديل من مسؤول الشعبة'+(D.owner?': '+D.owner:'')+'.';
  }
  function renderDays(){
    $('days').innerHTML=DAYS.map(function(d,i){return '<button class="day" data-i="'+i+'" aria-pressed="'+(i===st.day)+'">'+d+'<b>'+addDays(weekStart,i).getDate()+'</b></button>'}).join('');
    var L=SCHEDULES[G][st.day]||[];
    $('lectures').innerHTML=L.length?L.map(function(l,i){var isNow=st.day===TODAY_IDX&&i===0;
      return '<li class="lec'+(isNow?' now':'')+'"><div class="time"><b>'+l[0]+'</b>حتى '+l[1]+'</div><div class="body"><strong>'+esc(l[2])+(isNow?'<span class="tag">التالية</span>':'')+'</strong><span>'+esc(l[3])+'</span></div></li>'}).join(''):'<li class="empty">لا توجد محاضرات في هذا اليوم.</li>';
  }
  function renderHw(){
    var all=gdata().homework;
    var items=all.filter(function(h){var d=!!st.done[hwKey(h)];return st.filter==='all'||(st.filter==='open'?!d:d)});
    $('hwList').innerHTML=items.length?items.map(function(h){
      var k=hwKey(h),dn=!!st.done[k],dueTxt='',dateTxt='';
      if(h.date){var left=daysLeft(h.date),p=h.date.split('-');dateTxt=fmt(new Date(+p[0],+p[1]-1,+p[2]));
        dueTxt=dn?'منجز':(left<0?'متأخر '+(-left)+' يوم':(left===0?'ينتهي اليوم':(left===1?'يتبقى يوم':'يتبقى '+left+' أيام')))}
      else dueTxt=dn?'منجز':'بلا موعد';
      var id='hw'+all.indexOf(h);
      return '<li class="hw'+(dn?' done':'')+'"><input type="checkbox" id="'+id+'" data-k="'+esc(k)+'"'+(dn?' checked':'')+' aria-label="تحديد كمنجز"><label class="b" for="'+id+'"><strong>'+esc(h.t)+'</strong>'+(h.note?'<span class="note">'+esc(h.note)+'</span>':'')+'<span class="meta"><span>'+esc(h.s)+'</span>'+(dateTxt?'<span>'+esc(dateTxt)+'</span>':'')+'<span class="due">'+dueTxt+'</span></span></label></li>'}).join(''):
      '<li class="empty">'+(all.length?'لا توجد واجبات في هذا التصنيف.':'لا توجد واجبات حالياً. ستظهر هنا عندما ينشرها مسؤول الشعبة.')+'</li>';
    renderHeader();
  }
  function ftype(f){var e=(f.n.split('.').pop()||'').toLowerCase();return /^(png|jpe?g|gif|webp|avif)$/.test(e)?'img':(/^(doc|docx)$/.test(e)?'doc':'file')}
  function renderFiles(){
    var files=gdata().files;
    var open=!!st.folder;$('folderView').hidden=open;$('folderOpen').hidden=!open;
    $('filesTitle').textContent=open?st.folder:'ملفات المواد';
    if(!open){
      $('folders').innerHTML=SUBJECTS.map(function(s,i){var n=(files[s]||[]).length;
        return '<li><button class="folder" type="button" data-s="'+i+'"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><strong>'+esc(s)+'</strong><span>'+(n?n+(n===1?' ملف':' ملفات'):'فارغ')+'</span></button></li>'}).join('');
      return;
    }
    var fs=files[st.folder]||[];
    $('fileList').innerHTML=fs.length?fs.map(function(f){var t=ftype(f);var ext=(f.n.split('.').pop()||'FILE').toUpperCase().slice(0,4);
      var icon=t==='img'?'<img src="'+esc(f.p)+'" alt="" loading="lazy">':esc(ext);
      return '<li><a class="file" href="'+esc(f.p)+'" target="_blank" rel="noopener"><div class="ext'+(t==='doc'?' doc':'')+'">'+icon+'</div><div class="b"><strong>'+esc(f.n)+'</strong>'+(f.d?'<span>'+esc(f.d)+'</span>':'')+'</div><span class="open">فتح</span></a></li>'}).join(''):
      '<li class="empty">لا توجد ملفات في هذا المجلد بعد.</li>';
  }
  function renderAnn(){
    var a=gdata().announcements;
    $('annList').innerHTML=a.length?a.map(function(x){return '<li class="ann'+(x.pin?' pin':'')+'"><div class="h"><span>'+esc(x.w||D.owner||'')+'</span><span>'+esc(x.d||'')+(x.pin?' · مثبّت':'')+'</span></div><p>'+esc(x.t)+'</p></li>'}).join(''):
      '<li class="empty">لا توجد إعلانات حالياً.</li>';
  }
  function show(p){['schedule','hw','files','news'].forEach(function(k){$('p-'+k).hidden=k!==p});
    Array.prototype.forEach.call($('tabs').children,function(b){b.setAttribute('aria-selected',b.dataset.p===p)});window.scrollTo(0,0)}

  function openGroup(g){
    G=g;SUBJECTS=subjectsOf(g);st.day=TODAY_IDX>=0?TODAY_IDX:0;st.filter='all';st.folder=null;
    Array.prototype.forEach.call($('hwFilter').children,function(c){c.setAttribute('aria-pressed',c.dataset.f==='all')});
    try{localStorage.setItem('shuabti-group',g)}catch(e){}
    $('gate').hidden=true;$('app').hidden=false;
    renderHeader();renderDays();renderHw();renderFiles();renderAnn();show('schedule');
  }
  function openGate(){
    G=null;try{localStorage.removeItem('shuabti-group')}catch(e){}
    $('app').hidden=true;$('gate').hidden=false;window.scrollTo(0,0);
  }
  function hashGroup(){var h=(location.hash||'').replace('#','').toUpperCase();return GROUPS.indexOf(h)>-1?h:null}
  function route(){var g=hashGroup();if(g)openGroup(g);else openGate()}

  $('gateOwner').textContent=D.owner?'الطالب: '+D.owner:'';
  document.querySelector('.gbtns').addEventListener('click',function(e){var b=e.target.closest('.gbtn');if(b)location.hash=b.dataset.g});
  $('changeG').onclick=function(){location.hash=''};
  window.addEventListener('hashchange',route);
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.p)});
  $('days').addEventListener('click',function(e){var b=e.target.closest('.day');if(b){st.day=+b.dataset.i;renderDays()}});
  $('hwFilter').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;st.filter=b.dataset.f;
    Array.prototype.forEach.call($('hwFilter').children,function(c){c.setAttribute('aria-pressed',c===b)});renderHw()});
  $('hwList').addEventListener('change',function(e){var k=e.target.dataset.k;if(k==null)return;if(e.target.checked)st.done[k]=1;else delete st.done[k];saveDone();renderHw()});
  $('folders').addEventListener('click',function(e){var b=e.target.closest('.folder');if(!b)return;st.folder=SUBJECTS[+b.dataset.s];renderFiles();window.scrollTo(0,0)});
  $('backBtn').onclick=function(){st.folder=null;renderFiles();window.scrollTo(0,0)};

  var first=hashGroup();
  if(!first){var s=null;try{s=localStorage.getItem('shuabti-group')}catch(e){}
    if(s&&GROUPS.indexOf(s)>-1){try{history.replaceState(null,'','#'+s)}catch(e){location.hash=s;first=s}first=s}}
  if(first)openGroup(first);else openGate();
})();
</script>

</body></html>
